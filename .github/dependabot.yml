version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # TRENZ.Lib.RazorMail.MailKit is compiled against MimeKit 4, MailKit 5 ships MimeKit.Core instead
      - dependency-name: "MailKit"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "monthly"
